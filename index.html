<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lantern Drift — a sliding-light puzzle</title>
<meta property="og:image" content="https://arnavjhajharia.github.io/lantern-drift/title.jpg">
<meta name="description" content="Lantern Drift: guide drifting lanterns of the same colour home together. 28 hand-checked puzzles, every one solver-verified with an optimal par.">
<style>
  :root { --bg:#070b16; --ink:#e9e4d4; --dim:#8a8fa3; --a:#ffb347; --b:#4fd1a5; --c:#b48cff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:radial-gradient(ellipse at 50% 20%, #13203a 0%, var(--bg) 70%); color:var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; overflow:hidden; touch-action:none; user-select:none; }
  #app { display:flex; flex-direction:column; align-items:center; height:100%; padding:12px 12px calc(12px + env(safe-area-inset-bottom)); }
  header { width:min(640px,100%); display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  h1 { font-weight:400; letter-spacing:.18em; font-size:clamp(16px,3.6vw,22px); margin:4px 0; text-transform:uppercase; }
  h1 b { color:var(--a); font-weight:400; }
  .stat { color:var(--dim); font-size:14px; font-variant-numeric: tabular-nums; }
  .stat em { color:var(--ink); font-style:normal; }
  h1 { white-space:nowrap; }
  @media (max-width:480px) { .stat { font-size:12px; text-align:right; } h1 { letter-spacing:.1em; } button { padding:7px 12px; } }
  #sky { position:fixed; inset:0; z-index:0; pointer-events:none; }
  #app { position:relative; z-index:1; }
  #stage { flex:1; width:100%; display:flex; align-items:center; justify-content:center; min-height:0; }
  canvas { display:block; max-width:100%; max-height:100%; }
  #bar { width:min(640px,100%); display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
  button { font:inherit; color:var(--ink); background:#ffffff0d; border:1px solid #ffffff22; border-radius:999px; padding:8px 16px; cursor:pointer; }
  button:hover { background:#ffffff1a; }
  button.sel { border-color:currentColor; background:#ffffff14; }
  .chip { width:44px; padding:8px 0; font-size:18px; }
  #hint { color:var(--dim); font-size:13px; text-align:center; margin-top:6px; min-height:1.3em; }
  #overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#04070fcc; backdrop-filter: blur(3px); z-index:5; }
  #overlay.on { display:flex; }
  #overlay.art { background:linear-gradient(180deg,#04070f55 0%,#04070f22 40%,#04070fcc 100%), url(title.jpg) center/cover no-repeat; backdrop-filter:none; }
  #overlay.art .card { background:#0a1224cc; backdrop-filter: blur(4px); }
  #overlay.art h2 { font-size:clamp(26px,5vw,40px); letter-spacing:.24em; text-transform:uppercase; }
  #overlay.art h2 b { color:var(--a); font-weight:400; }
  .card { background:#0d1528; border:1px solid #ffffff1f; border-radius:18px; padding:22px 24px; width:min(560px,92vw); max-height:88vh; overflow:auto; text-align:center; }
  .card h2 { font-weight:400; letter-spacing:.12em; margin:0 0 8px; }
  .card p { color:#c9c4b4; line-height:1.5; margin:8px 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px; margin:14px 0; }
  .lv { border-radius:12px; padding:8px 0; font-size:15px; }
  .lv small { display:block; font-size:11px; color:var(--a); letter-spacing:2px; min-height:14px; }
  .lv[disabled] { opacity:.3; cursor:default; }
  .stars { font-size:34px; letter-spacing:6px; color:var(--a); margin:6px 0; }
  .stars .off { color:#ffffff22; }
  kbd { font-family:ui-monospace,monospace; font-size:12px; border:1px solid #ffffff33; border-radius:4px; padding:1px 5px; }
  a { color:var(--b); }
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23140c24'/><circle cx='16' cy='16' r='8' fill='%23ffb347'/></svg>">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="app">
  <header>
    <h1>Lantern <b>Drift</b></h1>
    <div class="stat">Night <em id="lvn">1</em>/<span id="lvt">28</span> · moves <em id="mv">0</em> · par <em id="par">0</em></div>
  </header>
  <div id="stage"><canvas id="cv" aria-label="puzzle board"></canvas></div>
  <div id="bar">
    <span id="chips"></span>
    <button id="hintb" title="Hint (H)">✦ Hint</button>
    <button id="undo" title="Undo (Z)">↶ Undo</button>
    <button id="reset" title="Restart (R)">⟲ Restart</button>
    <button id="menu" title="Levels (M)">☰ Nights</button>
    <button id="snd" title="Sound">♪ On</button>
  </div>
  <div id="hint"></div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>

<script src="portal.js"></script>
<script src="core.js"></script>
<script src="levels.js"></script>
<script src="daily.js"></script>
<script src="daily-hook.js"></script>
<script>
(() => {
  const COL = ['#ffb347', '#4fd1a5', '#b48cff'], NAME = ['amber', 'jade', 'violet'], GLYPH = ['●', '◆', '▲'];
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const save = JSON.parse(localStorage.getItem(window.LD_DAILY ? 'ld-daily-' + LD_DAILY.day : 'ld-save') || '{}'); // {best:{i:moves}}
  save.best = save.best || {};
  let L, B, pieces, hist, sel = 0, moves = 0, anim = null, idx = 0, won = false, sound = save.sound !== false;
  let cell = 48, ox = 0, oy = 0, t0 = performance.now(), ripples = [];

  // ---------- audio: produced CC0 sample files (audio/CREDITS.txt), no synthesized sound ----------
  // Each note is ONE recorded glass chime (audio/chime.*) played at a different speed, so the pentatonic melody stays.
  let ac = null, bus = null;
  const SND = {}, SND_LOADING = {};
  function ctxA() { if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.connect(ac.destination); ['chime', 'bump', 'click', 'music'].forEach(loadSnd); } return ac; }
  function loadSnd(name) {
    if (SND[name] || SND_LOADING[name]) return SND_LOADING[name];
    const get = ext => fetch('audio/' + name + '.' + ext).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(b => new Promise((ok, no) => ac.decodeAudioData(b, ok, no)));
    return (SND_LOADING[name] = get('ogg').catch(() => get('mp3')).then(b => (SND[name] = b)).catch(() => null));
  }
  const CHIME_HZ = 655; // measured fundamental of chime.ogg
  function play(name, rate = 1, gain = 0.5, dur = 0) {
    if (!sound) return; ctxA();
    const b = SND[name]; if (!b) return;
    const t = ac.currentTime, s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = b; s.playbackRate.value = rate; g.gain.value = gain;
    if (dur) { g.gain.setValueAtTime(gain, t + dur * 0.7); g.gain.linearRampToValueAtTime(0.0001, t + dur); }
    s.connect(g); g.connect(bus); s.start(t); if (dur) s.stop(t + dur + 0.02);
  }
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16];
  // same signature as before: semitones above C5, length, loudness. The 4th arg used to pick an oscillator: now 'triangle' = the soft bump.
  function chime(semi, dur = 0.9, gain = 0.12, type = 'sine') {
    if (type === 'triangle') return play('bump', 1, Math.min(1, gain * 10));
    play('chime', 523.25 * Math.pow(2, semi / 12) / CHIME_HZ, Math.min(1, gain * 5), Math.max(dur, 0.3) * 1.6);
  }

  let amb = null;
  function ambient(on) {
    if (!on) { if (amb) { amb.g.gain.setTargetAtTime(0, ac.currentTime, 0.6); } return; }
    ctxA();
    if (!amb) {
      const g = ac.createGain(); g.gain.value = 0; g.connect(bus);
      amb = { g, src: null };
      loadSnd('music').then(b => { if (!b || amb.src) return; const s = ac.createBufferSource(); s.buffer = b; s.loop = true; s.connect(g); s.start(); amb.src = s; });
    }
    amb.g.gain.setTargetAtTime(0.45, ac.currentTime, 1.2);
  }
  addEventListener('pointerdown', () => sound && ambient(true), { once: true });
  addEventListener('keydown', () => sound && ambient(true), { once: true });
  // interface sound: every button press clicks
  addEventListener('click', e => { if (e.target.closest && e.target.closest('button')) play('click', 1, 0.35); }, true);

  // ---------- level / state ----------
  function load(i) {
    if (window.Portal) { if (ac) Portal.setAudio(ac); Portal.start(); }
    idx = Math.max(0, Math.min(LEVELS.length - 1, i));
    L = LEVELS[idx]; B = LD.parse(L);
    pieces = B.pieces.map(p => ({ ...p })); hist = []; moves = 0; won = false; anim = null;
    const cols = [...new Set(pieces.map(p => p.c))].sort();
    sel = cols[0];
    $('lvn').textContent = idx + 1; $('lvt').textContent = LEVELS.length; $('par').textContent = L.par; $('mv').textContent = 0;
    $('chips').innerHTML = cols.length > 1 ? cols.map(c => `<button class="chip" data-c="${c}" style="color:${COL[c]}" title="${NAME[c]} (${c + 1})">${GLYPH[c]}</button>`).join(' ') : '';
    document.querySelectorAll('.chip').forEach(b => b.onclick = () => select(+b.dataset.c));
    select(sel);
    $('hint').innerHTML = idx === 0 ? 'Swipe or use <kbd>←↑→↓</kbd>. A lantern drifts until something stops it. Bring it to the ring of its colour.'
      : idx === 4 ? 'Two colours now: tap a lantern (or <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd>) to choose which colour drifts.'
      : idx === 8 ? 'Lanterns of one colour always drift together — use one to stop the other.'
      : idx === 18 ? 'Three colours. Every night has a solution in exactly par moves.' : '';
    save.last = idx; persist(); resize();
    // s22: on Night 1, pulse the first-move arrow ~0.7 s after load (and every 4.5 s until the first move) so a new player knows what to do without reading.
    clearTimeout(nudgeT);
    if (idx === 0 && !window.LD_DAILY) {
      const nudge = () => { if (idx !== 0 || moves || won) return;
        if (!anim && (!hintA || performance.now() - hintA.t > 4000)) { const r = LD.solve(B, pieces, 50000); if (r && r.len > 0) hintA = { c: r.path[0][0], d: r.path[0][1], t: performance.now() }; }
        nudgeT = setTimeout(nudge, 4500); };
      nudgeT = setTimeout(nudge, 700);
    }
  }
  function persist() { localStorage.setItem(window.LD_DAILY ? 'ld-daily-' + LD_DAILY.day : 'ld-save', JSON.stringify(save)); }
  function select(c) {
    if (!pieces.some(p => p.c === c)) return;
    sel = c;
    document.querySelectorAll('.chip').forEach(b => b.classList.toggle('sel', +b.dataset.c === c));
  }
  function move(dir) {
    if (won || anim) return;
    const r = LD.step(B, pieces, sel, dir);
    if (!r.moved.length) { chime(-12, 0.25, 0.05, 'triangle'); bump(dir); return; }
    hintA = null; hist.push(pieces); moves++; $('mv').textContent = moves;
    const dist = Math.max(...r.moved.map(m => Math.abs(m.to.x - m.from.x) + Math.abs(m.to.y - m.from.y)));
    anim = { from: pieces, to: r.pieces, moved: r.moved, t: performance.now(), dur: 90 + dist * 55 };
    pieces = r.pieces;
    const me = anim; setTimeout(() => { if (anim === me) onSettled(); }, anim.dur);
    chime(PENTA[sel * 2 + (moves % 3)] , 0.7, 0.08);
  }
  let hintA = null, nudgeT = 0;
  function hint() {
    if (won || anim) return;
    if (window.Portal && Portal.canReward && (save.hints | 0) >= 3) {
      $('hint').innerHTML = 'Free hints used up. <button id="rwh" style="font:inherit;cursor:pointer">▶ Watch a short ad for a hint</button>';
      $('rwh').onclick = (e) => { e.stopPropagation(); $('hint').textContent = 'Loading…'; Portal.rewarded(ok => { if (ok) { $('hint').textContent = 'Reading the current…'; setTimeout(hint2, 30); } else $('hint').textContent = 'No ad available right now. Try again in a moment.'; }); };
      return;
    }
    if (window.Portal && Portal.canReward) { save.hints = (save.hints | 0) + 1; persist(); }
    $('hint').textContent = 'Reading the current…';
    setTimeout(hint2, 30);
  }
  function hint2() {
    if (won || anim) return;
    const r = LD.solve(B, pieces, 400000);
    if (!r || r.len <= 0) { $('hint').textContent = r && r.len === -1 ? 'No way home from here. Undo or restart.' : 'Too tangled to see. Try undo.'; return; }
    const [c, d] = r.path[0]; select(c);
    hintA = { c, d, t: performance.now() };
    $('hint').textContent = `${r.len} move${r.len > 1 ? 's' : ''} from home. Try drifting ${NAME[c]} ${({U:'up',D:'down',L:'left',R:'right'})[d]}.`;
    chime(PENTA[5], 0.6, 0.06);
  }
  let bumpA = null;
  function bump(dir) { bumpA = { dir, t: performance.now() }; }
  function undo() { if (anim || !hist.length) return; pieces = hist.pop(); moves--; won = false; $('mv').textContent = moves; chime(-5, 0.3, 0.05); }
  function onSettled() {
    for (const m of anim.moved) {
      const p = anim.to[m.i];
      if (B.shrines.some(s => s.x === p.x && s.y === p.y && s.c === p.c)) { ripples.push({ x: p.x, y: p.y, c: p.c, t: performance.now() }); chime(PENTA[4 + p.c], 1.4, 0.1); }
    }
    anim = null;
    if (LD.solved(B, pieces)) win();
  }
  function starsFor(m, par) { return m <= par ? 3 : m <= Math.ceil(par * 1.5) ? 2 : 1; }
  function win() {
    won = true; if (window.Portal) Portal.stop();
    const prev = save.best[idx]; if (!prev || moves < prev) save.best[idx] = moves; persist();
    [0, 4, 7, 12].forEach((s, k) => setTimeout(() => chime(s + 7, 1.6, 0.09), k * 140));
    const st = starsFor(moves, L.par), last = idx === LEVELS.length - 1;
    setTimeout(() => show(`<h2>${last ? (window.LD_DAILY ? 'Home' : 'The last lantern is home') : 'Home'}</h2>
      <div class="stars">${'★'.repeat(st)}<span class="off">${'★'.repeat(3 - st)}</span></div>
      <p>${moves} moves · par ${L.par}${moves > L.par ? ' — it can be done in ' + L.par + '.' : moves === L.par ? ' — perfect.' : ''}</p>
      <p>${last ? `` + (window.LD_DAILY ? LD_dailyDone() : `Thank you for playing. ${totalStars()} / ${LEVELS.length * 3} stars.`) : ''}</p>
      <button id="again">Replay</button> ${last ? (window.LD_DAILY ? '<button id="lvls">Back to the river</button>' : '<button id="lvls">All nights</button>') : '<button id="next">Next night →</button>'}`, last), 650);
    // after a solved night, carry on by itself: visible 4-s countdown on the Next button; Replay / Escape / any other card cancels it
    if (!last) setTimeout(() => { const b = $('next'); if (!b) return; let n = 4; const tick = () => { if (!$('next') || !$('overlay').classList.contains('on')) return; if (n <= 0) { $('next').click(); return; } b.textContent = `Next night in ${n}…`; n--; autoT = setTimeout(tick, 1000); }; tick(); }, 700);
  }
  let autoT = null;
  function totalStars() { return Object.entries(save.best).reduce((s, [i, m]) => s + starsFor(m, LEVELS[i].par), 0); }
  function unlocked(i) { return i === 0 || save.best[i - 1] != null || save.best[i] != null; }
  function show(html, art) {
    clearTimeout(autoT);
    $('card').innerHTML = html; $('overlay').classList.add('on'); $('overlay').classList.toggle('art', !!art);
    const bind = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };
    bind('again', () => { hide(); load(idx); });
    bind('next', () => { hide(); window.Portal ? Portal.midgame(() => load(idx + 1)) : load(idx + 1); });
    bind('lvls', window.LD_DAILY ? LD_leaveDaily : levelMenu); bind('daily', LD_goDaily);
    bind('start', () => { hide(); load(save.last || 0); });
    $('card').querySelectorAll('.lv').forEach(b => b.onclick = () => { hide(); load(+b.dataset.i); });
  }
  function hide() { clearTimeout(autoT); $('overlay').classList.remove('on'); }
  function levelMenu() {
    show(`<h2>Nights</h2><p>${totalStars()} / ${LEVELS.length * 3} stars</p><div class="grid">${LEVELS.map((l, i) => {
      const b = save.best[i]; const st = b != null ? '★'.repeat(starsFor(b, l.par)) : '';
      return `<button class="lv" data-i="${i}" ${unlocked(i) ? '' : 'disabled'}>${i + 1}<small>${st}</small></button>`; }).join('')}</div>
      <button id="daily">Tonight's lantern ✦</button> <button onclick="document.getElementById('overlay').classList.remove('on')">Close</button>`);
  }

  // ---------- input ----------
  const KEY = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', w: 'U', s: 'D', a: 'L', d: 'R', W: 'U', S: 'D', A: 'L', D: 'R' };
  addEventListener('keydown', e => {
    if ($('overlay').classList.contains('on')) { if (e.key === 'Enter') { const n = $('next') || $('start') || $('again'); n && n.click(); } if (e.key === 'Escape') hide(); return; }
    if (KEY[e.key]) { e.preventDefault(); move(KEY[e.key]); }
    else if ('123'.includes(e.key)) select(+e.key - 1);
    else if (e.key === 'Tab') { e.preventDefault(); const cs = [...new Set(pieces.map(p => p.c))].sort(); select(cs[(cs.indexOf(sel) + 1) % cs.length]); }
    else if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') undo();
    else if (e.key === 'r' || e.key === 'R') load(idx);
    else if (e.key === 'm' || e.key === 'M') levelMenu();
    else if (e.key === 'h' || e.key === 'H') hint();
  });
  let down = null;
  cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointerup', e => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
    const r = cv.getBoundingClientRect(), sc = cv.width / r.width / devicePixelRatio;
    if (Math.hypot(dx, dy) < 18) { // tap: select lantern under finger, or move selected toward tap
      const gx = Math.floor(((e.clientX - r.left) * sc - ox) / cell), gy = Math.floor(((e.clientY - r.top) * sc - oy) / cell);
      const p = pieces.find(p => p.x === gx && p.y === gy);
      if (p) { select(p.c); chime(PENTA[p.c * 2], 0.25, 0.05); return; }
      const q = pieces.find(p => p.c === sel); if (!q) return; // tap on empty water: the selected lantern drifts toward the tap
      const tx = gx - q.x, ty = gy - q.y; if (!tx && !ty) return;
      move(Math.abs(tx) >= Math.abs(ty) ? (tx > 0 ? 'R' : 'L') : (ty > 0 ? 'D' : 'U'));
      return;
    }
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
  });
  $('undo').onclick = undo; $('hintb').onclick = hint; $('reset').onclick = () => load(idx); $('menu').onclick = window.LD_DAILY ? LD_leaveDaily : levelMenu;
  $('snd').onclick = () => { sound = !sound; save.sound = sound; persist(); ambient(sound); $('snd').textContent = sound ? '♪ On' : '♪ Off'; };
  $('snd').textContent = sound ? '♪ On' : '♪ Off';

  // ---------- sky: distant festival lanterns rising behind the river ----------
  const sky = document.getElementById('sky'), sx = sky.getContext('2d'); let motes = [];
  function skySize() { sky.width = innerWidth; sky.height = innerHeight;
    motes = Array.from({ length: Math.round(innerWidth * innerHeight / 26000) }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight,
      r: 1 + Math.random() * 2.4, v: 4 + Math.random() * 10, ph: Math.random() * 6, c: ['#ffb347', '#ffcf7a', '#ff9f5a'][Math.floor(Math.random() * 3)] })); }
  addEventListener('resize', skySize); skySize();
  let skyT = performance.now();
  function skyFrame(now) {
    const dt = Math.min(0.1, (now - skyT) / 1000); skyT = now;
    sx.clearRect(0, 0, sky.width, sky.height);
    for (const m of motes) {
      m.y -= m.v * dt; m.x += Math.sin(now / 2400 + m.ph) * 4 * dt;
      if (m.y < -10) { m.y = sky.height + 10; m.x = Math.random() * sky.width; }
      const a = 0.25 + 0.2 * Math.sin(now / 600 + m.ph);
      const g = sx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 5);
      g.addColorStop(0, m.c); g.addColorStop(1, m.c + '00');
      sx.globalAlpha = a; sx.fillStyle = g; sx.beginPath(); sx.arc(m.x, m.y, m.r * 5, 0, 7); sx.fill();
    }
    sx.globalAlpha = 1;
  }

  // ---------- render ----------
  function resize() {
    if (!B) return;
    const st = $('stage').getBoundingClientRect(), dpr = devicePixelRatio || 1;
    cell = Math.floor(Math.min(st.width / B.w, st.height / B.h, 76));
    const W = cell * B.w, H = cell * B.h;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ox = 0; oy = 0;
  }
  addEventListener('resize', resize);
  const ease = t => 1 - Math.pow(1 - t, 3);
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  function drawGlyph(c, x, y, r) {
    ctx.beginPath();
    if (c === 0) ctx.arc(x, y, r, 0, 7);
    else if (c === 1) { ctx.moveTo(x, y - r * 1.15); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r * 1.15); ctx.lineTo(x - r, y); ctx.closePath(); }
    else { ctx.moveTo(x, y - r * 1.1); ctx.lineTo(x + r * 1.05, y + r * 0.75); ctx.lineTo(x - r * 1.05, y + r * 0.75); ctx.closePath(); }
  }
  let lastFrame = 0;
  function frame(now, fb) {
    if (!fb) requestAnimationFrame(frame);
    lastFrame = performance.now(); skyFrame(now);
    if (!B) return;
    const T = (now - t0) / 1000, W = cell * B.w, H = cell * B.h;
    ctx.clearRect(0, 0, W, H);
    // water
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0e1a33'); g.addColorStop(1, '#0a1226');
    ctx.fillStyle = g; rr(0, 0, W, H, cell * 0.3); ctx.fill();
    ctx.strokeStyle = '#ffffff08'; ctx.lineWidth = 1;
    for (let y = 0; y < B.h; y++) for (let x = 0; x < B.w; x++) {
      if (B.walls.has(x + ',' + y)) continue;
      const s = Math.sin(T * 0.8 + x * 0.9 + y * 0.6) * 0.5 + 0.5;
      ctx.fillStyle = `rgba(120,160,255,${0.02 + s * 0.025})`; ctx.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
    }
    // stones
    for (const k of B.walls) {
      const [x, y] = k.split(',').map(Number);
      const sg = ctx.createRadialGradient(x * cell + cell * .4, y * cell + cell * .35, cell * .05, x * cell + cell / 2, y * cell + cell / 2, cell * .7);
      const edge = x === 0 || y === 0 || x === B.w - 1 || y === B.h - 1;
      sg.addColorStop(0, edge ? '#1a2033' : '#2f3750'); sg.addColorStop(1, edge ? '#0f1424' : '#161c2e');
      ctx.fillStyle = sg; rr(x * cell + 2, y * cell + 2, cell - 4, cell - 4, cell * 0.28); ctx.fill();
    }
    // shrines
    for (const s of B.shrines) {
      const cx = s.x * cell + cell / 2, cy = s.y * cell + cell / 2, pulse = 0.5 + 0.5 * Math.sin(T * 2 + s.c);
      ctx.strokeStyle = COL[s.c]; ctx.globalAlpha = 0.45 + pulse * 0.35; ctx.lineWidth = Math.max(2, cell * 0.06);
      ctx.beginPath(); ctx.arc(cx, cy, cell * 0.36, 0, 7); ctx.stroke();
      ctx.globalAlpha = 0.25; ctx.fillStyle = COL[s.c]; drawGlyph(s.c, cx, cy, cell * 0.1); ctx.fill(); ctx.globalAlpha = 1;
    }
    // ripples
    ripples = ripples.filter(r => now - r.t < 1200);
    for (const r of ripples) {
      const k = (now - r.t) / 1200;
      ctx.strokeStyle = COL[r.c]; ctx.globalAlpha = 1 - k; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(r.x * cell + cell / 2, r.y * cell + cell / 2, cell * (0.35 + k * 0.9), 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
    // lanterns
    let draw = pieces, k = 1;
    if (anim) { k = Math.min(1, (now - anim.t) / anim.dur); draw = anim.from.map((p, i) => ({ c: p.c, x: p.x + (anim.to[i].x - p.x) * ease(k), y: p.y + (anim.to[i].y - p.y) * ease(k) })); }
    let bx = 0, by = 0;
    if (bumpA) { const q = (now - bumpA.t) / 160; if (q > 1) bumpA = null; else { const d = LD.DIRS[bumpA.dir]; const a = Math.sin(q * Math.PI) * cell * 0.06; bx = d[0] * a; by = d[1] * a; } }
    draw.forEach((p, i) => {
      const home = !anim && B.shrines.some(s => s.x === p.x && s.y === p.y && s.c === p.c);
      const isSel = p.c === sel && !won;
      const cx = p.x * cell + cell / 2 + (isSel ? bx : 0), cy = p.y * cell + cell / 2 + (isSel ? by : 0) + Math.sin(T * 2.2 + i) * cell * 0.015;
      const fl = 0.85 + 0.15 * Math.sin(T * 9 + i * 3) * Math.sin(T * 5.3 + i);
      const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cell * (home ? 1.0 : 0.75));
      rg.addColorStop(0, COL[p.c] + (home ? 'aa' : '66')); rg.addColorStop(1, COL[p.c] + '00');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(cx, cy, cell * (home ? 1.0 : 0.75), 0, 7); ctx.fill();
      ctx.fillStyle = COL[p.c]; ctx.globalAlpha = fl; drawGlyph(p.c, cx, cy, cell * 0.24); ctx.fill(); ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff8e0'; ctx.globalAlpha = 0.85 * fl; drawGlyph(p.c, cx, cy, cell * 0.09); ctx.fill(); ctx.globalAlpha = 1;
      if (isSel && new Set(pieces.map(q => q.c)).size > 1) { ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]); ctx.lineDashOffset = -T * 12;
        ctx.beginPath(); ctx.arc(cx, cy, cell * 0.42, 0, 7); ctx.stroke(); ctx.setLineDash([]); }
    });
    if (hintA && now - hintA.t < 4000) {
      const [dx, dy] = LD.DIRS[hintA.d], a = 0.5 + 0.5 * Math.sin((now - hintA.t) / 140);
      ctx.fillStyle = COL[hintA.c]; ctx.globalAlpha = 0.35 + a * 0.5;
      for (const p of pieces) if (p.c === hintA.c) {
        const cx = p.x * cell + cell / 2 + dx * cell * 0.62, cy = p.y * cell + cell / 2 + dy * cell * 0.62, r = cell * 0.16;
        ctx.beginPath(); ctx.moveTo(cx + dx * r, cy + dy * r); ctx.lineTo(cx - dx * r + dy * r, cy - dy * r + dx * r); ctx.lineTo(cx - dx * r - dy * r, cy - dy * r - dx * r); ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // (hint arrows drawn in frame)
  // ---------- boot ----------
  if (!window.LEVELS || !LEVELS.length) { document.body.innerHTML = '<p style="padding:20px">levels.js missing</p>'; return; }
  const hl = /#lv=(\d+)/.exec(location.hash);
  load(hl ? +hl[1] - 1 : (save.last || 0));
  requestAnimationFrame(frame);
  setInterval(() => { if (performance.now() - lastFrame > 250) frame(performance.now(), true); }, 120); // keeps rendering where rAF is throttled
  const intro = () => show(`<h2>Lantern <b>Drift</b></h2>
    <p>On the night of the river festival, the lanterns have drifted loose.</p>
    <p>Each lantern drifts in a straight line until a stone or another lantern stops it. Lanterns of the same colour always drift together. Bring every lantern home to the ring of its colour.</p>
    <p style="color:var(--dim);font-size:14px">${LEVELS.length} nights · every one checked by a solver, par = the fewest possible moves<br>
    <kbd>←↑→↓</kbd>/swipe drift · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>/tap choose colour · <kbd>Z</kbd> undo · <kbd>H</kbd> hint · <kbd>R</kbd> restart</p>
    <button id="start">Light the first lantern</button> <button id="daily">Tonight's lantern ✦</button>`, true);
  if (!hl && !/#(selftest|demo)/.test(location.hash) && !Object.keys(save.best).length && !window.LD_DAILY && !window.bridge) intro(); // on Playgama (window.bridge) players land straight on Night 1; its in-board hint teaches the rules
  // ---------- self-test (#selftest): plays every level's optimal solution through the real input path ----------
  if (location.hash === '#selftest') {
    hide(); const res = []; let li = 0;
    load(LEVELS.length - 1); hint2(); const hintOk = /moves? from home/.test($('hint').textContent) && hintA != null;
    const run = () => { load(li); const sol = LEVELS[li].sol.split(' '); let k = 0;
      const tick = () => { if (anim) return setTimeout(tick, 30);
        if (k < sol.length) { select(+sol[k][0]); move(sol[k][1]); k++; return setTimeout(tick, 30); }
        setTimeout(() => { res.push(won && moves === LEVELS[li].par ? 1 : 0); hide(); li++;
          if (li < LEVELS.length) run(); else { const ok = res.filter(Boolean).length; document.title = 'SELFTEST ' + ok + '/' + res.length + (hintOk ? ' hint-ok' : ' HINT-FAIL'); document.body.setAttribute('data-selftest', ok + '/' + res.length + (hintOk ? ' hint-ok' : ' HINT-FAIL')); } }, 60); };
      tick(); };
    run();
  }
  // ---------- demo (#demo): auto-plays a few nights at human pace, used to record the gameplay video ----------
  if (location.hash.startsWith('#demo')) {
    if (location.hash === '#demo-rec') {
      ctxA(); ambient(true); const dst = ac.createMediaStreamDestination(); bus.connect(dst);
      const rec = new MediaRecorder(dst.stream, { mimeType: 'audio/webm;codecs=opus' }), chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = async () => { const b = new Blob(chunks, { type: 'audio/webm' }); const u8 = new Uint8Array(await b.arrayBuffer());
        let bin = ''; for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
        window.__audio = btoa(bin); document.title = 'DEMO DONE'; };
      rec.start(); window.__audioStart = Date.now(); window.__stopRec = () => rec.stop();
    }
    const plan = [0, 4, 9, 18, 23]; let pi = 0;
    const play = () => { hide(); load(plan[pi]); const sol = LEVELS[plan[pi]].sol.split(' '); let k = 0;
      const tick = () => { if (anim) return setTimeout(tick, 40);
        if (k < sol.length) { const c = +sol[k][0]; if (c !== sel) { select(c); setTimeout(tick, 380); return; } move(sol[k][1]); k++; return setTimeout(tick, 520); }
        setTimeout(() => { pi++; if (pi < plan.length) play(); else if (window.__stopRec) window.__stopRec(); else document.title = 'DEMO DONE'; }, 2600); };
      setTimeout(tick, 900); };
    intro(); setTimeout(play, 3200);
  }
})();
</script>
